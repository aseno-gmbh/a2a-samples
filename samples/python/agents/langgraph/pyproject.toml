[project]
name = "a2a-preme-agent"
version = "0.1.0"
description = "Sample LangGraph currency agent with A2A Protocol"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langgraph>=0.3.18",
    "pydantic>=2.10.6",
    "python-dotenv>=1.1.0",
    "fastapi>=0.115.0",
    "hypercorn>=0.17.3",
    "restate-sdk>=0.9.0",
    "a2a-sdk>=1.0.0",
    "langchain-litellm>=0.6.6",
    "botocore>=1.43.17",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
